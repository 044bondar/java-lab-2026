databaseChangeLog:
  - changeSet:
      id: 001-create-vehicles-table
      author: bohdan.kvasnyuk
      changes:
        - createTable:
            tableName: vehicles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: vin
                  type: VARCHAR(17)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: brand
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: model
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: manufacture_year
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: mileage_km
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: purchase_price
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: target_resale_price
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_at
                  type: TIMESTAMP
